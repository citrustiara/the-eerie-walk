<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>the eerie walk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <!-- 480x270 internal buffer, upscaled with image-rendering: pixelated -->
    <canvas id="screen"></canvas>

    <!-- Faint center dot — doubles as the flashlight aim point -->
    <div id="reticle"></div>
    <div id="gun-hint">press 1 to pull out the gun</div>

    <!-- One short line, when the building wants you to know something. -->
    <div id="subtitle"></div>

    <!-- Stamina. Does not exist until something makes it necessary. -->
    <div id="stamina"><div id="stamina-fill"></div></div>

    <!-- Ammo readout. Twelve rounds, no reload. -->
    <div id="hud">
      <div id="ammo-pips"></div>
      <div id="ammo-row">
        <span id="ammo-count">12</span>
        <span id="ammo-label">rounds</span>
      </div>
    </div>

    <!-- One overlay, four states: start, pause, an ending, and the list of
         endings. main.js swaps the mode class and rewrites the three lines.

         The title screen used to explain itself — a level number, the word
         backrooms, and a paragraph about the flashlight and the twelve rounds
         and the floor. All of it was answering questions nobody had asked yet.
         What is left is the name, the keys, and a door. -->
    <div id="overlay" class="mode-start">
      <div id="overlay-inner">
        <p id="overlay-eyebrow"></p>
        <h1 id="overlay-title">the eerie walk</h1>
        <p id="overlay-note">use headphones.</p>

        <dl id="controls">
          <div class="ctl"><dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>move</dd></div>
          <div class="ctl"><dt><kbd class="wide">mouse</kbd></dt><dd>look</dd></div>
          <div class="ctl"><dt><kbd>F</kbd></dt><dd>flashlight</dd></div>
          <div class="ctl"><dt><kbd>1</kbd></dt><dd>draw the gun</dd></div>
          <div class="ctl"><dt><kbd class="wide">click</kbd></dt><dd>fire</dd></div>
          <div class="ctl"><dt><kbd class="wide">esc</kbd></dt><dd>pause</dd></div>
        </dl>

        <!-- The collection. Rows you have not reached are dotted out at the
             length of the name they are hiding, so the shape of what is
             missing is visible and nothing else is. -->
        <div id="endings">
          <ol id="endings-list"></ol>
        </div>

        <p id="overlay-action">click to enter</p>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
